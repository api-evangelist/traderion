description: Traderion is a fintech company that combines technology and gamification
  to build digital learning platforms for banks and financial institutions. Its products
  include a gamified sales and trading simulator covering equities, FX, bonds, and
  commodities with AI-powered feedback, a MiFID II regulatory-compliance training
  platform built as a virtual simulated bank, and a risk-profiling platform for identifying
  and detecting risky behavioral patterns within organizations. A Seedcamp portfolio
  company, Traderion does not currently publish a public developer portal or API.
